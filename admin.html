<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>嘉创AI - 卡密管理</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }
        .container {
            width: 100%;
            max-width: 600px;
        }
        h1 {
            font-size: 24px;
            color: #222;
            margin-bottom: 8px;
        }
        .subtitle {
            font-size: 13px;
            color: #888;
            margin-bottom: 24px;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            margin-bottom: 20px;
        }
        .card h2 {
            font-size: 16px;
            color: #333;
            margin-bottom: 16px;
        }
        .field {
            margin-bottom: 14px;
        }
        .field label {
            display: block;
            font-size: 13px;
            color: #555;
            margin-bottom: 6px;
            font-weight: 500;
        }
        .field input {
            width: 100%;
            height: 40px;
            padding: 0 12px;
            border: 1px solid #e0e0e8;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .field input:focus {
            border-color: #4f6ef7;
        }
        .btn {
            height: 42px;
            padding: 0 24px;
            background: #4f6ef7;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background: #3d5bd9; }
        .btn:disabled { background: #b0b8d1; cursor: not-allowed; }
        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }
        .msg {
            font-size: 13px;
            margin-top: 10px;
            min-height: 20px;
        }
        .msg.success { color: #27ae60; }
        .msg.error { color: #e74c3c; }
        .result {
            margin-top: 16px;
            max-height: 300px;
            overflow-y: auto;
        }
        .result:empty { display: none; }
        .key-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: #f8f8fb;
            border-radius: 6px;
            margin-bottom: 6px;
            font-size: 13px;
        }
        .key-item .key {
            font-family: "Courier New", monospace;
            font-weight: 600;
            color: #333;
        }
        .key-item .copy-btn {
            background: #4f6ef7;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 11px;
            cursor: pointer;
        }
        .key-item .copy-btn:hover { background: #3d5bd9; }
        .key-item .copy-btn.copied { background: #27ae60; }
        .divider {
            height: 1px;
            background: #eee;
            margin: 16px 0;
        }
        .history-title {
            font-size: 13px;
            color: #888;
            margin-bottom: 10px;
        }
        .empty-hint {
            font-size: 13px;
            color: #aaa;
            text-align: center;
            padding: 20px;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #4f6ef7;
            text-decoration: none;
            font-size: 13px;
        }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>卡密管理</h1>
        <p class="subtitle">生成和管理嘉创AI的VIP卡密</p>

        <!-- 生成卡密 -->
        <div class="card">
            <h2>生成新卡密</h2>
            <div class="field">
                <label>管理密钥</label>
                <input type="password" id="adminSecret" placeholder="请输入管理员密钥">
            </div>
            <div class="field">
                <label>会员天数</label>
                <input type="number" id="durationDays" value="30" min="1" max="3650">
            </div>
            <div class="field">
                <label>生成数量</label>
                <input type="number" id="count" value="10" min="1" max="100">
            </div>
            <div class="btn-row">
                <button class="btn" onclick="generateKeys()">生成卡密</button>
            </div>
            <div class="msg" id="genMsg"></div>
            <div class="result" id="genResult"></div>
        </div>

        <!-- 查看已生成的卡密 -->
        <div class="card">
            <h2>未使用卡密</h2>
            <div class="btn-row">
                <button class="btn" onclick="loadUnusedKeys()" style="width:auto;">刷新列表</button>
            </div>
            <div class="result" id="unusedResult"></div>
        </div>

        <a class="back-link" href="index.html">← 返回主页面</a>
    </div>

    <script>
        const API_BASE = window.location.hostname === 'localhost' ? '' : 'https://api.jiachuang233.xyz';

        async function generateKeys() {
            const secret = document.getElementById('adminSecret').value.trim();
            const days = parseInt(document.getElementById('durationDays').value);
            const count = parseInt(document.getElementById('count').value);
            const msgEl = document.getElementById('genMsg');
            const resultEl = document.getElementById('genResult');

            if (!secret) {
                msgEl.textContent = '请输入管理密钥';
                msgEl.className = 'msg error';
                return;
            }

            try {
                msgEl.textContent = '生成中...';
                msgEl.className = 'msg';
                const resp = await fetch(API_BASE + '/api/auth/generate-card', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ adminSecret: secret, durationDays: days, count })
                });
                const data = await resp.json();

                if (!resp.ok) {
                    msgEl.textContent = data.error || '生成失败';
                    msgEl.className = 'msg error';
                    return;
                }

                msgEl.textContent = '成功生成 ' + data.cards.length + ' 张卡密（' + days + '天VIP）';
                msgEl.className = 'msg success';

                resultEl.innerHTML = data.cards.map(k =>
                    '<div class="key-item">' +
                        '<span class="key">' + k + '</span>' +
                        '<button class="copy-btn" onclick="copyKey(this, \'' + k + '\')">复制</button>' +
                    '</div>'
                ).join('');

            } catch (e) {
                msgEl.textContent = '网络错误，请检查后端服务';
                msgEl.className = 'msg error';
            }
        }

        async function loadUnusedKeys() {
            const secret = document.getElementById('adminSecret').value.trim();
            const resultEl = document.getElementById('unusedResult');

            if (!secret) {
                resultEl.innerHTML = '<div class="empty-hint">请先输入管理密钥</div>';
                return;
            }

            try {
                // 用 generate 接口获取列表不行，我们直接查所有未使用的
                // 需要一个查询接口，但目前没有，先提示用户
                resultEl.innerHTML = '<div class="empty-hint">请在生成后直接复制保存卡密</div>';
            } catch (e) {}
        }

        function copyKey(btn, key) {
            navigator.clipboard.writeText(key).then(() => {
                btn.textContent = '已复制';
                btn.className = 'copy-btn copied';
                setTimeout(() => {
                    btn.textContent = '复制';
                    btn.className = 'copy-btn';
                }, 2000);
            });
        }
    </script>
</body>
</html>
